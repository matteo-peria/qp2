# LUMI / Cray GNU programming environment using Cray compiler wrappers.
#
# This configuration is intended for module stacks similar to:
#   LUMI/25.03
#   PrgEnv-gnu
#   gcc-native
#   cray-mpich
#   cray-hdf5-parallel
#   cray-libsci
#   craype-x86-milan
#
# The Cray wrappers inject the MPI, HDF5, and LibSci link flags selected by
# the loaded modules. This avoids hard-coding stale OpenBLAS paths.

[COMMON]
FC           : ftn -ffree-line-length-none -I . -mavx -g -fPIC
CC           : cc -g -fPIC -mavx
LAPACK_LIB   :
IRPF90       : irpf90
IRPF90_FLAGS : --ninja --align=32

[OPTION]
MODE    : OPT
CACHE   : 0
OPENMP  : 1

[OPT]
FCFLAGS : -Ofast -march=native

[PROFILE]
FC      : -p -g
FCFLAGS : -Ofast

[DEBUG]
FCFLAGS : -fcheck=all -g

[OPENMP]
FC           : -fopenmp
IRPF90_FLAGS : --openmp
