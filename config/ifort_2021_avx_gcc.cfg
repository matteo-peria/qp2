# Intel Fortran with the GNU C/C++ compilers
#
# This configuration uses ifort for Fortran and GCC/G++ for C and C++.

[COMMON]
FC           : ifort -fpic -diag-disable=10448
CC           : gcc -g -fPIC -mavx
CXX          : g++
LAPACK_LIB   : -mkl=parallel
IRPF90       : irpf90
IRPF90_FLAGS : --ninja --align=32 -DINTEL

[OPTION]
MODE    : OPT
OPENMP  : 1

[OPT]
FC       : -traceback
FCFLAGS  : -xAVX -O2 -ip -ftz -g

[PROFILE]
FC       : -p -g
FCFLAGS  : -xSSE4.2 -O2 -ip -ftz

[DEBUG]
FC      : -g -traceback
FCFLAGS : -xSSE2 -C -fpe0 -implicitnone

[OPENMP]
FC           : -qopenmp
IRPF90_FLAGS : --openmp
